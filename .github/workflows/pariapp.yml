# Relais PariApp — run « journée » : trois jobs séquentiels (≤ 6 h chacun, limite GitHub) qui bouclent (scripts/boucle.py) :
# offre FDJ toutes les 30 min, toutes les 10 min quand un match suivi approche (relevés Pinnacle pre/close garantis),
# disponibilité des joueurs (API-Football), CLV, Issue alias, commit à chaque passage.
# GitHub exécute les crons de façon aléatoire (le 05/11 : 4 runs sur ~55 attendus). Ici un cron de secours part chaque heure :
# si le run du jour tourne déjà, le nouveau reste en attente (concurrency) puis sort aussitôt (tranches terminées) ;
# s'il a été perdu ou a planté, le suivant reprend la journée là où elle en est. Tout est en UTC.
name: pariapp-relais
on:
  schedule:
    - cron: "13 7-21 * * *"
  workflow_dispatch: {}      # « Run workflow » : lancer la journée à la main si GitHub a perdu le cron (sort aussitôt si tout est fini)
permissions:
  contents: write
  issues: write
concurrency:
  group: pariapp-journee
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: "1"
jobs:
  matin:
    name: "07:00–12:30 UTC"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests
      - env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}", APIFOOTBALL_KEY: "${{ secrets.APIFOOTBALL_KEY }}", GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/boucle.py --tranche 0
  apres_midi:
    name: "12:30–18:00 UTC"
    needs: matin
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests
      - env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}", APIFOOTBALL_KEY: "${{ secrets.APIFOOTBALL_KEY }}", GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/boucle.py --tranche 1
  soiree:
    name: "18:00–21:30 UTC"
    needs: apres_midi
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests
      - env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}", APIFOOTBALL_KEY: "${{ secrets.APIFOOTBALL_KEY }}", GH_TOKEN: "${{ github.token }}" }
        run: python3 scripts/boucle.py --tranche 2
